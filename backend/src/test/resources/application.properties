# STUDY NOTES: Settings used only when tests run. Spring loads this file instead of the main
# STUDY NOTES: application.properties (same name on the test classpath wins), so tests get a clean,
# STUDY NOTES: fast, throw-away setup that never touches real developer data.
# Tests never touch the developer's file database.
# WHY: "mem" means an in-memory H2 database. It starts empty and disappears after the JVM stops,
# WHY: so every test run starts from the same clean state. DB_CLOSE_DELAY=-1 keeps it alive
# WHY: between connections while the JVM runs, so the schema Flyway created is not lost.
# INTERVIEW: Tests must be repeatable and isolated; a shared file database would leak data between runs.
spring.datasource.url=jdbc:h2:mem:salary-test;DB_CLOSE_DELAY=-1
# Tests create their own data; the 10,000-row seed is not needed.
# WHY: The seeder would insert 10,000 random rows at startup. That makes tests slow and makes
# WHY: counts in assertions unpredictable. Each test builds exactly the rows it needs instead.
app.seed.enabled=false
