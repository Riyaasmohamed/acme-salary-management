# STUDY NOTES: Main Spring Boot configuration for running the app locally. Settings live here, not in code, so they can change without recompiling.
# WHY: The application name appears in logs and is the default name Spring uses for this app.
spring.application.name=salary-management
# WHY: 8080 is the port the Angular dev-server proxy forwards /api to.
server.port=8080

# H2 in file mode: data survives restarts and lives in backend/data/ (git-ignored).
# WHY: "file:" (not "mem:") keeps the data on disk, so the HR Manager's edits are still there after a restart.
spring.datasource.url=jdbc:h2:file:./data/salarydb
# WHY: "sa" with an empty password is H2's default local user; fine for local development only.
spring.datasource.username=sa
spring.datasource.password=

# Flyway owns the schema; Hibernate only checks that the entities match it.
# WHY: "validate" makes start-up fail if the Employee class and the table do not match, instead of Hibernate silently changing the table.
# INTERVIEW: "The schema is written in a reviewed, versioned Flyway file; ddl-auto=update can miss indexes and cannot be reviewed."
spring.jpa.hibernate.ddl-auto=validate
# WHY: Turning off open-in-view closes the database session when the service method ends, so no hidden lazy queries run while JSON is written.
spring.jpa.open-in-view=false

# Send inserts to the database in batches (used by the 10,000-row seed).
# WHY: 500 inserts go in one JDBC round trip instead of 500 separate trips; this is why the seed takes only 2-3 seconds.
spring.jpa.properties.hibernate.jdbc.batch_size=500
# WHY: Hibernate sorts inserts by entity type so more of them fit into the same batch.
spring.jpa.properties.hibernate.order_inserts=true

# Demo data: 10,000 employees, created only when the employee table is empty.
# WHY: These three values are read into the SeedProperties record (prefix app.seed); tests turn seeding off.
app.seed.enabled=true
# WHY: 10,000 employees is the size given in the requirements.
app.seed.employee-count=10000
# WHY: A fixed random seed gives the same employees every time, so demos and numbers are reproducible.
app.seed.random-seed=42

# H2 web console for looking at the data during local development (only reachable from this machine):
# http://localhost:8080/h2-console  ->  JDBC URL jdbc:h2:file:./data/salarydb, user sa, empty password
# WHY: Lets us check the data with plain SQL while developing; it would be switched off outside development.
spring.h2.console.enabled=true
